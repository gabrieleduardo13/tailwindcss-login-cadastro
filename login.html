<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body class="bg-neutral-200 flex flex-col items-center justify-center h-screen">
    

<div class="bg-white p-5 rounded-lg shadow-md w-96">

 <h2 class="font-bold items-center justify-center text-center">Entrar</h2>
    <h3 class="text-sm text-gray-500 items-center text-center">Acesse sua conta</h3>

    <form action="" class="flex flex-col gap-3">

        
        <h2 class="font-bold">Email</h2>
        <input type="email" placeholder="Voce@email.com" class="border border-gray-300 p-2 rounded">
        <h2 class="font-bold">Senha</h2>
      <input type="password" placeholder="*******" class="border border-gray-300 p-2 rounded" minlength="6" pattern="(?=.*[A-Z])(?=.*[a-z]).{6,}" title="A senha deve ter no mínimo 6 caracteres, incluindo pelo menos uma letra maiúscula e uma minúscula" required>
        <button type="submit" class="bg-black text-white p-2 rounded hover:bg-gray-800  text-center text-sm">Entrar</button>
       <h3 class="text-center text-sm text-gray-500">Não tem conta? <a href="index.html" class="font-bold text-black hover:underline">Cadastre-se</a></h3>
    </form>
</div>

</body>
</html>
